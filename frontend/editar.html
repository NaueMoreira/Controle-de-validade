<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
<div class="header">
  <img src="images/logo-farmaceuticos.png" alt="Logo Farmacêuticos" class="logo">
  <h2>Editar Produto Proximo ao Vencimento</h2>
  <img src="images/logo-farmaceuticos.png" alt="Logo Farmacêuticos" class="logo">
</div>

<div id="box-editar">
  <div id="box-cadastro-interno">
    <form id="form">
      <input id="codigo" placeholder="Código">
      <input id="nome" placeholder="Nome">
      <input type="date" id="validade">
      <input type="number" id="quantidade" placeholder="Quantidade">

      <select id="sessao">
        <option value="Referencia">Referência</option>
            <option value="Genérico">Genérico</option>
            <option value="Similar">Similar</option>
            <option value="Perfumaria">Perfumaria</option>
            <option value="Alimenticios">Alimentícios</option>
            <option value="MIP">MIP - Medicamentos isentos de prescrição</optio
      </select><br><br>

      <button id="btn-salvar" type="submit">Salvar</button>
    </form>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');
const REMOTE_API = "https://controle-de-validade-b1kj.onrender.com";
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3000'
  : REMOTE_API;

async function carregar() {
  try {
    const res = await fetch(API + "/produtos/" + id);
    
    if (!res.ok) {
      alert("Erro ao carregar produto!");
      window.location.href = 'listar.html';
      return;
    }
    
    const p = await res.json();

    codigo.value = p.codigoInterno || '';
    nome.value = p.nome || '';
    validade.value = p.validade || '';
    quantidade.value = p.quantidade || '';
    sessao.value = p.sessao || '';
  } catch (erro) {
    console.error("Erro ao carregar:", erro);
    alert("Erro ao carregar produto: " + erro.message);
    window.location.href = 'listar.html';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  try {
    // Validação básica
    if (!codigo.value.trim() || !nome.value.trim() || !validade.value || !quantidade.value) {
      alert("Por favor, preencha todos os campos!");
      return;
    }

    if (quantidade.value < 0) {
      alert("A quantidade não pode ser negativa!");
      return;
    }

    const res = await fetch(API + "/produtos/" + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        codigoInterno: codigo.value,
        codigoBarras: codigo.value,
        nome: nome.value,
        validade: validade.value,
        quantidade: parseInt(quantidade.value),
        sessao: sessao.value
      })
    });

    if (!res.ok) {
      const erro = await res.json();
      alert("Erro ao salvar: " + (erro.mensagem || erro.erro || "Erro desconhecido"));
      return;
    }

    alert("Produto atualizado com sucesso!");
    window.location.href = 'listar.html';
  } catch (erro) {
    console.error("Erro ao salvar:", erro);
    alert("Erro ao salvar produto: " + erro.message);
  }
});

carregar();
</script>
</body>
</html>
